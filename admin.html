<div class="mrb"><dl><div><dt>HP / WhatsApp</dt><dd>${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(x.phone)}</a>`:"-"}</dd></div><div><dt>Tanggal daftar</dt><dd>${esc(dt(x))||"-"}</dd></div><div><dt>Kelas</dt><dd>${esc(x.kelas)||"-"}</dd></div><div><dt>Alamat</dt><dd>${esc(x.address)||"-"}</dd></div><div><dt>Yang diketahui tentang KIR</dt><dd>${esc(x.knowledge)||"-"}</dd></div><div><dt>Alasan bergabung</dt><dd>${esc(x.reason)||"-"}</dd></div></dl>
<div class="bar"><button class="btn sm ghost" data-a="ph" data-i="${x.id}">📷 ${x.photo?"Ganti":"Tambah"} Foto</button>${on?"":`<button class="btn sm" data-a="tm" data-i="${x.id}">➕ Jadikan Anggota</button>`}<button class="btn sm red" data-a="rm" data-i="${x.id}">🗑 Hapus</button></div></div></div>`}).join("")||'<p class="mut">Belum ada pendaftar.</p>'};
$("#q").oninput=draw;draw();
$("#mg").onclick=async ev=>{const hd=ev.target.closest(".mrh");if(hd){const r=hd.parentElement,op=r.classList.toggle("open");hd.setAttribute("aria-expanded",op);MOP=op?r.dataset.id:null;return}const b=ev.target.closest("[data-a]");if(!b)return;const x=L.find(y=>y.id==b.dataset.i),a=b.dataset.a;if(!x)return;MOP=a=="rm"?null:x.id;
try{
if(a=="ph"){const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=async()=>{if(!f.files[0])return;b.disabled=true;try{const ph=await cropImage(f.files[0],1,"Pangkas Foto Anggota");if(!ph){b.disabled=false;return}await Fs.updateDoc(Fs.doc(db,"members",x.id),{photo:ph});await syncTeam(x,{photo:ph});toast("Foto tersimpan");memberList()}catch(e){console.error(e);toast("Gagal menyimpan foto",1);b.disabled=false}};f.click()}
else if(a=="tm"){if(!confirm("Tampilkan "+x.name+" di daftar anggota website publik?"))return;b.disabled=true;const r=await Fs.addDoc(Fs.collection(db,"team"),{title:x.name||"",category:x.kelas||"",desc:"",img:x.photo||"",createdAt:Fs.serverTimestamp()});await Fs.updateDoc(Fs.doc(db,"members",x.id),{teamId:r.id});toast("Ditambahkan ke Daftar Anggota");memberList()}
else if(a=="rm"){if(!confirm("Hapus data pendaftar "+x.name+"? (Jika sudah tampil di situs, hapus juga lewat menu Daftar Anggota.)"))return;await Fs.deleteDoc(Fs.doc(db,"members",x.id));toast("Dihapus");memberList()}
}catch(e){console.error(e);toast("Gagal: "+(e.code||e.message),1);b.disabled=false}};
$("#csv").onclick=()=>{const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},C=[["name","Nama"],["kelas","Kelas"],["phone","HP"],["address","Alamat"],["knowledge","Yang diketahui tentang KIR"],["reason","Alasan"]],t=[C.map(c=>q(c[1])).concat(q("Tanggal")).join(",")].concat(L.map(x=>C.map(([k])=>q(x[k])).concat(q(dt(x))).join(","))).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="anggota-kir.csv";a.click()}}
async function list(c,cols,h){const s=await Fs.getDocs(Fs.query(Fs.collection(db,c),Fs.orderBy("createdAt","desc"))),L=s.docs.map(d=>({id:d.id,...d.data()})),val=(x,k)=>k=="createdAt"?(x[k]&&x[k].toDate?x[k].toDate().toLocaleString("id-ID"):""):x[k];
V.innerHTML=`<h2>${h} (${L.length})</h2>${c=="members"?'<button class="btn sm" id="csv">Unduh CSV</button>':""}<div class="tw" style="margin-top:1rem"><table><tr>${cols.map(x=>`<th>${x[1]}</th>`).join("")}<th></th></tr>${L.map(x=>`<tr>${cols.map(([k])=>`<td>${esc(val(x,k))}</td>`).join("")}<td>${c=="members"?`<button class="btn sm" data-a="${x.id}">Jadikan Anggota</button> `:""}<button class="btn sm red" data-d="${x.id}">Hapus</button></td></tr>`).join("")}</table></div>`;
V.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id==b.dataset.a);if(!x||!confirm("Tampilkan "+x.name+" di daftar anggota situs?"))return;b.disabled=true;try{await Fs.addDoc(Fs.collection(db,"team"),{title:x.name||"",category:x.kelas||"",desc:"",img:"",published:true,createdAt:Fs.serverTimestamp()});toast("Ditambahkan ke Daftar Anggota");b.textContent="✓ Sudah"}catch(e){console.error(e);toast("Gagal menambahkan",1);b.disabled=false}});
V.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Hapus data ini?")){await Fs.deleteDoc(Fs.doc(db,c,b.dataset.d));toast("Dihapus");list(c,cols,h)}});
if($("#csv"))$("#csv").onclick=()=>{const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},t=[cols.map(x=>q(x[1])).join(",")].concat(L.map(x=>cols.map(([k])=>q(val(x,k))).join(","))).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="anggota-kir.csv";a.click()}}
init();
</script></body></html>
